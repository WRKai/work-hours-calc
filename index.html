<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f4f8;--card:#fff;--text:#17233b;--muted:#8b95a7;
  --accent:#4f46e5;--border:#e6e9f0;--red:#e05d5d;--radius:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:24px 14px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font-size:20px;letter-spacing:.5px}
header .today{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(23,35,59,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head h2{font-size:15px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}

/* 汇总 */
.summary{display:flex;align-items:stretch;gap:16px;padding:22px 18px}
.big-box{flex:1.6;min-width:0}
.big-box .label{font-size:13px;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px}
.big .num{font-size:58px;font-weight:800;letter-spacing:-1px;line-height:1}
.big .unit{font-size:14px;color:var(--muted)}
.big-box .sub{font-size:12px;color:var(--muted)}
.divider{width:1px;background:var(--border)}
.small-box{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.small-box .label{font-size:12px;color:var(--muted)}
.small-box .num{font-size:21px;font-weight:700}
.small-box .unit{font-size:12px;color:var(--muted)}
.small-box .sub{font-size:12px;color:var(--muted)}
.pos{color:#2563eb}
.neg{color:var(--red)}

/* 打卡 */
#clockBtn{width:100%;padding:20px;font-size:20px;font-weight:700;letter-spacing:6px;color:#fff;background:linear-gradient(135deg,#4f46e5,#6366f1);border:none;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .06s,box-shadow .2s}
#clockBtn:active{transform:scale(.97)}
#clockBtn:hover{box-shadow:0 8px 20px rgba(79,70,229,.35)}
.info{text-align:center;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.6}
.est{display:block;margin-top:5px;font-size:12px;color:var(--muted)}

input[type=time]{font:inherit;font-size:14px;padding:7px 6px;border:1px solid var(--border);border-radius:8px;background:#fafbfd;color:var(--text);width:98px}
input[type=time]:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}

/* 行 */
#restList .row,#recordList .rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eef0f5}
#restList .row:last-child,#recordList .rec:last-child{border-bottom:none}
.arr{color:#c3cad6}
button.ghost{font:inherit;font-size:13px;color:var(--accent);background:#eef0ff;border:none;border-radius:8px;padding:5px 10px;cursor:pointer}
button.ghost:hover{background:#e0e4ff}
button.del{font:inherit;color:#c9d1dd;background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}
button.del:hover{color:var(--red);background:#fdecec}

#restList .row{flex-wrap:wrap}
#restList .row .del{margin-left:auto}
#restList .row input{width:112px}

.rec{flex-wrap:wrap}
.rec .rd{width:60px;flex-shrink:0;display:flex;flex-direction:column;line-height:1.3}
.rec .rd b{font-size:13px;font-weight:600}
.rec .rd span{font-size:11px;color:var(--muted)}
.rec .rd em{font-size:10px;font-style:normal;color:var(--accent);background:#eef0ff;border-radius:4px;padding:0 4px;margin-top:2px;width:fit-content}
.rec .rh{margin-left:auto;font-size:15px;font-weight:700;min-width:54px;text-align:right;flex-shrink:0}
.rec .rh small{font-weight:400;font-size:12px;color:var(--muted)}
.rec.today{background:#f6f7ff;border-radius:10px;padding:9px 8px}
@media (max-width:520px){
  .rec{justify-content:center;gap:8px}
  .rec .rd{flex-basis:100%;flex-direction:row;justify-content:center;align-items:center;gap:5px;width:auto;text-align:center}
  .rec .rd em{margin-top:0}
  .rec .rh{margin-left:0;min-width:0}
}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:9px 0;font-size:14px}
.nav{display:flex;align-items:center;gap:6px}
.nav span{font-size:13px;min-width:76px;text-align:center;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工时计算器</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <section class="card summary">
    <div class="big-box">
      <div class="label">本月工时 · 截至昨日</div>
      <div class="big"><span class="num" id="monthHours">0.0</span><span class="unit">小时</span></div>
      <div class="sub" id="monthSub">本月出勤 0 天</div>
    </div>
    <div class="divider"></div>
    <div class="small-box">
      <div class="label">上月工时</div>
      <div><span class="num" id="lastHours">0.0</span><span class="unit">小时</span></div>
      <div class="sub" id="lastSub">0 天</div>
    </div>
  </section>

  <section class="card">
    <button id="clockBtn" onclick="clockIn()">打 卡 上 班</button>
    <p class="info" id="todayInfo">今日尚未打卡</p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>休息时间段</h2>
      <button class="ghost" onclick="addRest()">+ 添加</button>
    </div>
    <div id="restList"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>打卡记录</h2>
      <div class="nav">
        <button class="ghost" onclick="shiftMonth(-1)">‹</button>
        <span id="monthLabel"></span>
        <button class="ghost" onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <p class="hint">直接编辑时间即可修改；两个都为空 = 休息日。每日第一次打卡为上班，之后均为下班（覆盖）。每日在岗减去 8 小时：超出为 +（蓝），不足为负（红），保留两位小数、只往小取。</p>
    <div id="recordList"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>数据备份</h2>
    </div>
    <div class="btns">
      <button class="ghost" onclick="exportData()">导出 JSON</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">导入 JSON</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
    </div>
    <p class="hint">导出可跨设备备份/迁移；导入将覆盖当前数据。加载时自动清理：仅保留去年和今年的记录。</p>
  </section>

  <p class="foot">数据保存在浏览器 localStorage，仅本机可见</p>
</div>

<script>
'use strict';
  const LS_REC = 'worktime.records';
  const LS_REST = 'worktime.rests';
  const state = {
    records: {},
    rests: [{ start: '12:00', end: '13:30' }, { start: '18:00', end: '18:30' }]
  };
  const view = { y: 0, m: 0 };
  const WD = '日一二三四五六';

  function pad(n) { return String(n).padStart(2, '0'); }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function toMin(t) {
    if (typeof t !== 'string') return NaN;
    const p = t.split(':');
    if (p.length !== 2) return NaN;
    const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return NaN;
    return h * 60 + m;
  }

  function load() {
    try {
      const r = JSON.parse(localStorage.getItem(LS_REC));
      if (r !== null) state.records = r;
    } catch (e) { /* 忽略损坏数据 */ }
    try {
      const r = JSON.parse(localStorage.getItem(LS_REST));
      if (r !== null) state.rests = r;
    } catch (e) { /* 忽略损坏数据 */ }
  }
  function save() {
    localStorage.setItem(LS_REC, JSON.stringify(state.records));
    localStorage.setItem(LS_REST, JSON.stringify(state.rests));
  }

  // 一天的实际工时（分钟）：下班 - 上班，减去重叠休息段，再减 8 小时
  // 用法：dayWorkMin(rec) 或 dayWorkMin(上班, 下班)
  function dayWorkMin(startOrRec, end) {
    let s, e;
    if (end === undefined) {
      const rec = startOrRec;
      if (!rec || rec.start === undefined || rec.end === undefined) return 0;
      s = toMin(rec.start); e = toMin(rec.end);
    } else {
      s = toMin(startOrRec); e = toMin(end);
    }
    if (isNaN(s) || isNaN(e)) return 0;
    // 仅当结束时间在凌晨（≤06:00）时才视为跨零点；否则按同日计算（避免"立即下班"误判为隔夜）
    if (e < s && e <= 360) e += 1440;
    let total = e - s;
    state.rests.forEach(function (r) {
      const rs = toMin(r.start), re = toMin(r.end);
      if (isNaN(rs) || isNaN(re) || re <= rs) return;
      const ov = Math.min(e, re) - Math.max(s, rs);
      if (ov > 0) total -= ov;
    });
    return Math.max(0, total) - 480; // 每日减去 8 小时标准工时
  }

  // 分钟 → 小时：向数轴左侧（总是往小）取两位小数；负值红色、正值蓝色带 +
  function fmtSigned(min) {
    const r = Math.floor((min / 60) * 100) / 100;
    if (r < 0) return '<span class="neg">' + r.toFixed(2) + '</span>';
    if (r > 0) return '<span class="pos">+' + r.toFixed(2) + '</span>';
    return '<span class="pos">0.00</span>';
  }

  // 统计某月工时至昨天（分钟总数 + 出勤天数）
  function computeMonth(y, m) {
    const dim = new Date(y, m, 0).getDate();
    const tk = todayKey();
    let total = 0, days = 0;
    for (let d = 1; d <= dim; d++) {
      const key = y + '-' + pad(m) + '-' + pad(d);
      if (key >= tk) break; // 只统计到昨天
      const rec = state.records[key];
      if (rec && rec.start !== undefined && rec.end !== undefined) days++;
      total += dayWorkMin(rec);
    }
    return { total: total, days: days };
  }

  function renderSummary() {
    const now = new Date();
    const cy = now.getFullYear(), cm = now.getMonth() + 1;
    const cur = computeMonth(cy, cm);
    const py = cm === 1 ? cy - 1 : cy, pm = cm === 1 ? 12 : cm - 1;
    const prev = computeMonth(py, pm);
    document.getElementById('monthHours').innerHTML = fmtSigned(cur.total);
    document.getElementById('monthSub').textContent = '本月出勤 ' + cur.days + ' 天';
    document.getElementById('lastHours').innerHTML = fmtSigned(prev.total);
    document.getElementById('lastSub').textContent = prev.days + ' 天';
  }

  function renderToday() {
    const rec = state.records[todayKey()];
    const btn = document.getElementById('clockBtn');
    const info = document.getElementById('todayInfo');
    if (!rec || rec.start === undefined) {
      btn.textContent = '打 卡 上 班';
      info.textContent = '今日尚未打卡';
      return;
    }
    // 实时预估：只要打了上班卡，就按当前时间作为下班时间计算
    const now = new Date();
    const nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
    const est = fmtSigned(dayWorkMin(rec.start, nowHM));
    if (rec.end === undefined) {
      btn.textContent = '打 卡 下 班';
      info.innerHTML = '上班 ' + rec.start + ' · 尚未下班<span class="est">若现在打卡，今日 ' + est + ' 小时</span>';
    } else {
      btn.textContent = '更新下班时间';
      info.innerHTML = '上班 ' + rec.start + ' · 下班 ' + rec.end + ' · 今日 ' + fmtSigned(dayWorkMin(rec)) + ' 小时（明天起计入统计）<span class="est">若现在打卡，今日 ' + est + ' 小时</span>';
    }
  }

  function renderRests() {
    document.getElementById('restList').innerHTML = state.rests.map(function (r, i) {
      return '<div class="row">' +
        '<input type="time" value="' + (r.start || '') + '" onchange="setRest(' + i + ',\'start\',this.value)">' +
        '<span class="arr">→</span>' +
        '<input type="time" value="' + (r.end || '') + '" onchange="setRest(' + i + ',\'end\',this.value)">' +
        '<button class="del" onclick="removeRest(' + i + ')" title="删除">✕</button>' +
        '</div>';
    }).join('');
  }

  function rowHours(rec) {
    if (!rec || (rec.start === undefined && rec.end === undefined)) return '<small>休息</small>';
    if (rec.start === undefined || rec.end === undefined) return '<small>未完成</small>';
    return fmtSigned(dayWorkMin(rec)) + 'h';
  }

  function renderRecords() {
    const now = new Date();
    const cy = now.getFullYear(), cm = now.getMonth() + 1, cd = now.getDate();
    const y = view.y, m = view.m;
    const dim = new Date(y, m, 0).getDate();
    const last = (y === cy && m === cm) ? cd : dim; // 当前月只显示到今天
    document.getElementById('monthLabel').textContent = y + '年' + m + '月';
    const rows = [];
    for (let d = 1; d <= last; d++) {
      const key = y + '-' + pad(m) + '-' + pad(d);
      const rec = state.records[key];
      const wd = WD[new Date(y, m - 1, d).getDay()];
      const isToday = y === cy && m === cm && d === cd;
      rows.push('<div class="rec' + (isToday ? ' today' : '') + '">' +
        '<div class="rd"><b>' + pad(m) + '-' + pad(d) + '</b><span>周' + wd + '</span>' + (isToday ? '<em>今日</em>' : '') + '</div>' +
        '<input type="time" value="' + ((rec && rec.start) || '') + '" onchange="setRec(\'' + key + '\',\'start\',this.value)">' +
        '<span class="arr">→</span>' +
        '<input type="time" value="' + ((rec && rec.end) || '') + '" onchange="setRec(\'' + key + '\',\'end\',this.value)">' +
        '<div class="rh">' + rowHours(rec) + '</div>' +
        '<button class="del" onclick="clearRec(\'' + key + '\')" title="清空">✕</button>' +
        '</div>');
    }
    document.getElementById('recordList').innerHTML = rows.join('');
  }

  // ---- 交互 ----
  function clockIn() {
    const key = todayKey();
    const rec = state.records[key] || {};
    const now = new Date();
    const hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if (rec.start === undefined) rec.start = hm; // 第一次打卡 = 上班
    else rec.end = hm;                          // 之后 = 下班（覆盖）
    state.records[key] = rec;
    save();
    renderAll();
  }

  function setRec(key, field, value) {
    const rec = state.records[key] || {};
    if (value) rec[field] = value; else delete rec[field];
    if (rec.start === undefined && rec.end === undefined) delete state.records[key];
    else state.records[key] = rec;
    save();
    renderAll();
  }
  function clearRec(key) { delete state.records[key]; save(); renderAll(); }

  function addRest() { state.rests.push({ start: '', end: '' }); save(); renderAll(); }
  function removeRest(i) { state.rests.splice(i, 1); save(); renderAll(); }
  function setRest(i, field, value) {
    const r = state.rests[i];
    if (r === undefined) return;
    if (value) r[field] = value; else delete r[field];
    if ((r.start === undefined || r.start === '') && (r.end === undefined || r.end === '')) state.rests.splice(i, 1);
    save();
    renderAll();
  }

  function shiftMonth(d) {
    const now = new Date();
    view.m += d;
    if (view.m < 1) { view.m = 12; view.y--; }
    if (view.m > 12) { view.m = 1; view.y++; }
    if (view.y > now.getFullYear() || (view.y === now.getFullYear() && view.m > now.getMonth() + 1)) {
      view.y = now.getFullYear();
      view.m = now.getMonth() + 1;
    }
    renderAll();
  }

  function renderAll() {
    renderSummary();
    renderToday();
    renderRests();
    renderRecords();
  }

  // 自动清理：只保留去年与今年的打卡记录（两年前的数据清除）
  function cleanupOld() {
    const keepFrom = (new Date().getFullYear() - 1) + '-01-01';
    let removed = 0;
    Object.keys(state.records).forEach(function (k) {
      if (k < keepFrom) { delete state.records[k]; removed++; }
    });
    if (removed) save();
    return removed;
  }

  function exportData() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      records: state.records,
      rests: state.rests
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'worktime-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  function importData(input) {
    const file = input.files && input.files[0];
    input.value = ''; // 清空以允许重复选择同一文件
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        if (typeof data !== 'object' || data === null) throw new Error('bad root');
        const records = data.records || {};
        const rests = data.rests === undefined ? null : data.rests;
        if (typeof records !== 'object' || Array.isArray(records)) throw new Error('bad records');
        if (rests !== null && !Array.isArray(rests)) throw new Error('bad rests');
        if (!confirm('导入将覆盖当前全部数据，确定继续吗？')) return;
        state.records = records;
        if (rests !== null) state.rests = rests;
        cleanupOld();
        save();
        renderAll();
        alert('导入成功');
      } catch (e) {
        alert('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
  }

  function init() {
    load();
    cleanupOld();
    const now = new Date();
    view.y = now.getFullYear();
    view.m = now.getMonth() + 1;
    document.getElementById('todayLabel').textContent =
      now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + WD[now.getDay()];
    renderAll();
    setInterval(renderToday, 60000); // 每分钟刷新"若现在打卡"实时预估
  }
  init();
</script>
</body>
</html>
